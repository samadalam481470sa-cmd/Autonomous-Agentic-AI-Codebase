[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agentic-ai-codebase"
version = "0.1.0"
description = "Self-hostable coding agent foundation"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["services*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
