name: Code-OSS upstream overlay validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/code_oss_migrate.py'
      - 'code_oss_integration/**'
      - '.github/workflows/code-oss-migration.yml'
      - '.gitmodules'
permissions:
  contents: read
jobs:
  pinned-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Initialize pinned MIT Code-OSS git submodule
        run: git submodule update --init --depth 1 upstream/code-oss
      - name: Apply original Agentic Workbench branding and extension overlay
        run: python scripts/code_oss_migrate.py
      - name: Check upstream commit, branded product, Open VSX and extension copies
        run: python scripts/code_oss_migrate.py --verify
      - name: Validate extension-host JavaScript
        run: |
          node --check upstream/code-oss/extensions/agentic-local/extension.js
          node --test upstream/code-oss/extensions/agentic-local/sse.test.cjs
      - name: Report scope
        run: |
          echo "Source overlay preparation passed; no full upstream Code-OSS desktop compile was run."
          git -C upstream/code-oss rev-parse HEAD
