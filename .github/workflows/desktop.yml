name: Desktop packaging
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/desktop/**'
      - 'scripts/build_backend.py'
      - 'scripts/desktop_backend.py'
      - 'services/runtime-rust/**'
      - '.github/workflows/desktop.yml'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: package:win
          - os: ubuntu-latest
            target: package:linux
          - os: macos-latest
            target: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/build_backend.py
      - run: python -m pytest -q
      - run: node --check apps/desktop/main.cjs
      - run: node --check apps/desktop/preload.cjs
      - run: cargo build --release --manifest-path services/runtime-rust/Cargo.toml
      - name: Stage Rust gateway
        shell: bash
        run: |
          mkdir -p dist/backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp services/runtime-rust/target/release/agentic-runtime.exe dist/backend/
          else
            cp services/runtime-rust/target/release/agentic-runtime dist/backend/
          fi
      - run: npm install
        working-directory: apps/desktop
      - run: npm run ${{ matrix.target }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: error
