name: Desktop packaging
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: package:win
          - os: ubuntu-latest
            target: package:linux
          - os: macos-latest
            target: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/build_backend.py
      - run: npm install
        working-directory: apps/desktop
      - run: npm run ${{ matrix.target }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: error
