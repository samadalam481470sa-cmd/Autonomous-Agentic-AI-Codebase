name: Desktop packaging
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'scripts/build_backend.py'
      - 'scripts/desktop_backend.py'
      - 'services/runtime-rust/**'
      - 'services/api/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: package:win
          - os: ubuntu-latest
            target: package:linux
          - os: macos-latest
            target: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: python -m pip install -r requirements.txt pyinstaller 'pytest>=8,<10'
      - name: Install offline Monaco editor build dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Bundle Monaco and local language workers
        working-directory: apps/web
        run: npm run build
      - name: Confirm offline editor assets exist
        run: python -c "from pathlib import Path; root=Path('apps/web/assets'); names=('monaco-entry.js','monaco-entry.css','editor.worker.js','ts.worker.js','MONACO_LICENSE.txt'); assert all((root/name).is_file() for name in names), 'Offline editor bundle incomplete'"
      - run: python scripts/build_backend.py
      - run: python -m pytest -q
      - run: node --test apps/desktop/hardware.test.cjs apps/desktop/model-runtime.test.cjs
      - run: node --check apps/desktop/main.cjs
      - run: node --check apps/desktop/preload.cjs
      - run: cargo build --release --manifest-path services/runtime-rust/Cargo.toml
      - name: Stage Rust gateway
        shell: bash
        run: |
          mkdir -p dist/backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp services/runtime-rust/target/release/agentic-runtime.exe dist/backend/
          else
            cp services/runtime-rust/target/release/agentic-runtime dist/backend/
          fi
      - run: npm install
        working-directory: apps/desktop
      - run: npm run ${{ matrix.target }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish draft GitHub release with downloadable installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=()
          for f in release-assets/*; do
            if [[ -f "$f" && ( "$f" == *.exe || "$f" == *.dmg || "$f" == *.AppImage ) ]]; then assets+=("$f"); fi
          done
          if [ "${#assets[@]}" -eq 0 ]; then echo "No installers produced"; exit 1; fi
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then tag="v0.3.0-beta.${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --draft --prerelease --title "Autonomous Agentic AI $tag (Experimental)" --notes "Unsigned experimental desktop installers. llama.cpp and a compatible GGUF model are still required. Do not deploy to production without security and clean-machine testing."
