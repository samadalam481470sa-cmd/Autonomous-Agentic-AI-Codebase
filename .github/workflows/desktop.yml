name: Desktop packaging
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'apps/desktop/**'
      - 'scripts/build_backend.py'
      - 'scripts/desktop_backend.py'
      - 'services/runtime-rust/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: package:win
          - os: ubuntu-latest
            target: package:linux
          - os: macos-latest
            target: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r requirements.txt pyinstaller 'pytest>=8,<10'
      - run: python scripts/build_backend.py
      - run: python -m pytest -q
      - run: node --check apps/desktop/main.cjs
      - run: node --check apps/desktop/preload.cjs
      - run: cargo build --release --manifest-path services/runtime-rust/Cargo.toml
      - name: Stage Rust gateway
        shell: bash
        run: |
          mkdir -p dist/backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp services/runtime-rust/target/release/agentic-runtime.exe dist/backend/
          else
            cp services/runtime-rust/target/release/agentic-runtime dist/backend/
          fi
      - run: npm install
        working-directory: apps/desktop
      - run: npm run ${{ matrix.target }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish draft GitHub release with downloadable installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then echo "No installers produced"; exit 1; fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --draft --title "Autonomous Agentic AI ${GITHUB_REF_NAME} (Experimental)" --notes "Unsigned experimental desktop installers. llama.cpp and a compatible GGUF model are still required. Do not deploy to production without security and clean-machine testing."
