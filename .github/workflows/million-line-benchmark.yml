name: Million-line SQLite index benchmark
on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark_million_line_index.py'
      - 'services/api/code_index.py'
      - '.github/workflows/million-line-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m scripts.benchmark_million_line_index
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: million-line-index-results
          path: reports/million_line_benchmark.json
          if-no-files-found: warn
