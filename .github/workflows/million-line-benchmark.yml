name: Million-line SQLite index benchmark
on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark_million_line_index.py'
      - 'services/api/code_index.py'
      - '.github/workflows/million-line-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m scripts.benchmark_million_line_index
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: million-line-index-results
          path: reports/million_line_benchmark.json
          if-no-files-found: warn
