name: Local bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

      - name: Build browser editor assets
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Confirm downloadable UI assets exist
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'apps/dashboard/dist/index.html',
              'apps/web/assets/monaco-entry.js',
              'apps/web/assets/monaco-entry.css',
              'apps/web/assets/ts.worker.js',
              'apps/web/assets/MONACO_LICENSE.txt',
              'packages/ui/tokens.css',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit('Missing bundle assets: ' + ', '.join(missing))
          print('All downloadable UI assets are present')
          PY

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build downloadable bundle
        run: python scripts/package_local.py --output-dir dist

      - name: Verify bundle checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: aetherion-omniforge-local
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish the release and attach assets
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
            TAG="v$VERSION"
          fi
          echo "Publishing $TAG from $GITHUB_SHA"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
