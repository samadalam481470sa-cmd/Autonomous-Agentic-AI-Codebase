name: Verify
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q services
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/web/monaco-entry.js
      - run: node --check apps/web/build.mjs
      - run: node --test apps/desktop/hardware.test.cjs
      - run: python scripts/check_inline_scripts.py
      - run: pytest -q
