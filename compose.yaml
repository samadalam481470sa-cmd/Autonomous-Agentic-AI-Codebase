services:
  agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - agent-data:/app/database
      - agent-workspaces:/app/workspaces
    security_opt:
      - no-new-privileges:true
volumes:
  agent-data:
  agent-workspaces:
