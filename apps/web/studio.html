<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic AI Studio</title><style>
:root{color-scheme:dark;font:14px system-ui}*{box-sizing:border-box}body{margin:0;background:#090e19;color:#e7edff}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;background:#131c30;border-bottom:1px solid #34415b}header strong{font-size:19px}input,textarea,button{font:inherit;border-radius:8px}input,textarea{color:#eef3ff;background:#101a2d;border:1px solid #3c4d6a;padding:10px}input{width:160px}button{border:0;background:#5769ed;color:white;padding:10px 15px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.secondary{background:#2c3953}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(300px,1fr);height:calc(100vh - 70px)}aside,.panel{min-width:0;border-right:1px solid #34415b;display:flex;flex-direction:column}h3{margin:0;padding:16px;border-bottom:1px solid #34415b;font-size:14px}.files{padding:12px;overflow:auto;flex:1}.file{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;overflow-wrap:anywhere}.file:hover{background:#2c3953}.toolbar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #34415b}.toolbar input{flex:1;min-width:100px}textarea{border:0;border-radius:0;resize:none;flex:1;min-height:160px;font:13px/1.6 ui-monospace,monospace;padding:18px}pre{white-space:pre-wrap;overflow:auto;padding:14px;font:12px/1.5 ui-monospace,monospace;background:#0b1220;flex:1;margin:0}iframe{width:100%;height:100%;border:0;background:white}#status{color:#9db4df;padding:10px}nav{display:flex;gap:8px;padding:10px}nav button{flex:1}@media(max-width:950px){.layout{grid-template-columns:180px 1fr}.preview{grid-column:1/-1;min-height:400px}.layout{height:auto}.panel{min-height:480px}}@media(max-width:600px){.layout{grid-template-columns:1fr}aside{min-height:180px}.panel{min-height:450px}}
</style></head><body><header><strong>✦ Autonomous AI Studio</strong><label>Project <input id="project" value="demo"></label><label>Admin token <input id="token" type="password" placeholder="AGENT_ADMIN_TOKEN"></label><button id="refresh" class="secondary">Refresh files</button><a href="/" style="color:#b4c5ff">Chat ↗</a></header><div class="layout"><aside><h3>Project Explorer</h3><div class="files" id="files"></div><div id="status">Enter your local admin token.</div></aside><section class="panel"><h3>Code Editor</h3><div class="toolbar"><input id="path" placeholder="index.html"><button id="open" class="secondary">Open</button><button id="suggest" class="secondary">AI propose</button><button id="batch" class="secondary">AI multi-file</button><button id="autotrial" class="secondary">AI test & retry</button><button id="approvebatch" class="secondary" disabled>Approve batch</button><button id="diff">Review diff</button><button id="save" disabled>Approve & save</button><button id="test" class="secondary">Run tests</button></div><textarea id="editor" spellcheck="false" placeholder="Write HTML, CSS, JavaScript, Python or other source here…"></textarea></section><section class="panel preview"><h3>Changes / Sandboxed HTML Preview</h3><nav><button id="showdiff" class="secondary">Diff</button><button id="showpreview" class="secondary">HTML preview</button></nav><pre id="changes">Edit a file and click Review diff.</pre><iframe id="preview" title="Sandboxed HTML preview" sandbox="" referrerpolicy="no-referrer" style="display:none"></iframe></section></div><script>
const $=id=>document.getElementById(id);let expected=null,reviewed=null,batchReview=null;
function status(s){$("status").textContent=s}
async function api(route,body,extra={}){const r=await fetch("/api/studio/"+route,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value,...extra},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);return d}
const project=()=>$("project").value.trim(),path=()=>$("path").value.trim(),body=()=>({project:project(),path:path(),content:$("editor").value,expected_sha256:expected});
async function refresh(){try{const d=await api("files/"+encodeURIComponent(project()));$("files").replaceChildren();for(const f of d.files){const b=document.createElement("button");b.className="file";b.textContent=f;b.onclick=()=>{$("path").value=f;open()};$("files").appendChild(b)}status(d.files.length+" files")}catch(e){status(e.message)}}
async function open(){try{const d=await api("read",{project:project(),path:path()});$("editor").value=d.content;expected=d.sha256;reviewed=null;$("save").disabled=true;status(d.exists?"File opened":"New file");}catch(e){status(e.message)}}
async function diff(){try{const d=await api("diff",body());expected=d.sha256;reviewed=$("editor").value;$("changes").textContent=d.diff||"No changes";$("changes").style.display="block";$("preview").style.display="none";$("save").disabled=!d.changed;status("Review changes, then approve to save.")}catch(e){status(e.message)}}
async function multiFile(){const raw=prompt("Files to change (comma separated, maximum 8; for example src/app.py,tests/test_app.py)",path());if(!raw)return;const paths=raw.split(",").map(x=>x.trim()).filter(Boolean);if(!paths.length||paths.length>8){status("Choose between 1 and 8 files.");return}const instruction=prompt("Describe the multi-file coding task. The AI will only prepare proposals.");if(!instruction)return;batchReview=null;$("approvebatch").disabled=true;$("batch").disabled=true;status("Generating multi-file proposal...");try{const r=await fetch("/api/agent/batch/propose",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value},body:JSON.stringify({project:project(),paths,instruction})});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);batchReview={...d,project:project()};$("changes").textContent=d.changes.map(c=>c.diff||("No changes: "+c.path)).join("\n\n");$("changes").style.display="block";$("preview").style.display="none";$("approvebatch").disabled=false;status("Review every change. No files have been modified.");}catch(e){status("Multi-file proposal failed: "+e.message)}finally{$("batch").disabled=false}}
async function autoTrial(){const raw=prompt("Files to work on (comma separated; maximum 8)",path());if(!raw)return;const paths=raw.split(",").map(x=>x.trim()).filter(Boolean);if(!paths.length||paths.length>8){status("Choose 1–8 files.");return}const goal=prompt("What should the local AI implement and debug?");if(!goal)return;if(!confirm("Start a bounded local AI coding trial? It will run an allowlisted test command in an offline Docker container, with up to 3 attempts. Live files will not be changed."))return;const btn=$("autotrial");btn.disabled=true;batchReview=null;$("approvebatch").disabled=true;status("Running local autonomous trial...");try{const r=await fetch("/api/agent/trial/run",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value,"X-Confirm-Execution":"approve"},body:JSON.stringify({project:project(),paths,goal,test_command:"python -m compileall -q .",attempts:3})});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);batchReview={...d.proposal,project:project()};$("changes").textContent="Test result: "+(d.trial_passed?"PASS":"FAIL")+" after "+d.attempts+" attempts\n\n"+d.tests.map(t=>"Attempt "+t.attempt+" exit "+t.exit_code+"\n"+t.output).join("\n\n")+"\n\n"+d.proposal.changes.map(c=>c.diff).join("\n\n");$("changes").style.display="block";$("preview").style.display="none";$("approvebatch").disabled=false;status("Trial complete. Review test output and ALL proposed source diffs before approval.")}catch(e){status("Trial unavailable: "+e.message)}finally{btn.disabled=false}}
async function approveBatch(){if(!batchReview||batchReview.project!==project()){status("Project changed; create a new proposal.");return}if(!confirm("Approve ALL "+batchReview.changes.length+" proposed file changes? Read the entire diff before confirming."))return;const d=batchReview;batchReview=null;$("approvebatch").disabled=true;try{const r=await fetch("/api/agent/batch/apply",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value,"X-Confirm-Change":"approve"},body:JSON.stringify({project:d.project,proposal_id:d.proposal_id,proposal_hash:d.proposal_hash})});const output=await r.json();if(!r.ok)throw Error(output.detail||r.status);status("Applied "+output.applied+" files. Run tests to verify.");refresh()}catch(e){status("Batch not applied: "+e.message)}}
async function suggest(){const instruction=prompt("Describe the change for "+path()+". The AI will propose code but cannot save it.");if(!instruction)return;const btn=$("suggest");btn.disabled=true;status("Generating AI proposal...");try{const r=await fetch("/api/agent/propose",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value},body:JSON.stringify({project:project(),path:path(),instruction})});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);$("editor").value=d.content;expected=d.expected_sha256;reviewed=d.content;$("changes").textContent=d.diff||"No changes";$("changes").style.display="block";$("preview").style.display="none";$("save").disabled=!d.changed;status("AI proposal generated. Read the diff and source before approving; code has not been saved.")}catch(e){status("AI proposal failed: "+e.message)}finally{btn.disabled=false}}
async function save(){if(reviewed!==$("editor").value){status("Editor changed after review. Review again.");$("save").disabled=true;return}if(!confirm("Approve writing "+path()+" in project "+project()+"?"))return;try{const d=await api("apply",body(),{"X-Confirm-Change":"approve"});expected=d.sha256;reviewed=null;$("save").disabled=true;status("Saved "+d.path);refresh()}catch(e){status(e.message)}}
async function testProject(){const command="python -m pytest -q";if(!confirm("Run allowlisted tests in the isolated Docker runner for project "+project()+"? This requires Docker and ENABLE_ISOLATED_EXECUTION=1."))return;const btn=$("test");btn.disabled=true;status("Running isolated tests...");try{const r=await fetch("/api/execution/run",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+$("token").value,"X-Confirm-Execution":"approve"},body:JSON.stringify({project:project(),command})});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);$("changes").textContent="Test exit code: "+d.exit_code+"\n\n"+(d.stdout||"")+"\n"+(d.stderr||"");$("changes").style.display="block";$("preview").style.display="none";status(d.exit_code===0?"Tests passed":"Tests failed; inspect output")}catch(e){status("Tests unavailable: "+e.message)}finally{btn.disabled=false}}
async function preview(){try{const html=path().endsWith(".html")?$("editor").value:null;if(html===null)throw Error("Select an HTML file");const frame=$("preview");frame.srcdoc=html;frame.style.display="block";$("changes").style.display="none";status("Sandboxed HTML preview: scripts and forms disabled.")}catch(e){status(e.message)}}
$("autotrial").onclick=autoTrial;$("batch").onclick=multiFile;$("approvebatch").onclick=approveBatch;$("test").onclick=testProject;$("suggest").onclick=suggest;$("refresh").onclick=refresh;$("open").onclick=open;$("diff").onclick=diff;$("save").onclick=save;$("showdiff").onclick=()=>{$("changes").style.display="block";$("preview").style.display="none"};$("showpreview").onclick=preview;$("editor").oninput=()=>{$("save").disabled=true;reviewed=null};$("path").oninput=()=>{$("save").disabled=true;reviewed=null};$("project").oninput=()=>{$("save").disabled=true;$("approvebatch").disabled=true;batchReview=null;reviewed=null};
</script></body></html>
